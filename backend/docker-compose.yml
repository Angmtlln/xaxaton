services:
  db:
    image: postgres:16-alpine
    container_name: contractors-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contractors
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed_dictionary.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contractors"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Образу нужны обе части проекта, поэтому контекст — корень репозитория.
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: contractors-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/contractors
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ..:/data:ro

volumes:
  pgdata:
